<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Nutan Varsh: one drop through the year</title>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/nv.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Baloo Gujarati"; src: url("assets/fonts/baloo-bhai-2-gujarati-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Baloo Gujarati"; src: url("assets/fonts/baloo-bhai-2-gujarati-800-normal.woff2") format("woff2"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0410; }
      body { font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0410; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Geist", sans-serif; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="16" data-track-index="1">
        <svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <div id="end"></div>
      </section>
      <!-- original soundtrack generated by ../make_audio.py from the same timings: rain, water, santoor, bansuri, tabla, bells -->
      <audio id="music" src="assets/audio/drop.wav" data-start="0" data-duration="16" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        var el = MM.el, sc = document.getElementById("sc");
        // ---- the drop's journey: [time, x, y] in world space (the world is one tall scene the camera follows). Keep in step with make_audio.py ----
        var SEG = [
          { type: "hang", p: [[0.5, 540, 520], [1.5, 540, 540]] },
          { type: "fall", p: [[1.5, 540, 540], [2.5, 540, 1900]] },
          { type: "pipe", p: [[2.5, 540, 1900], [3.0, 540, 2150], [3.5, 820, 2150], [4.0, 820, 1790]] },
          { type: "arc", p: [[4.0, 820, 1790], [5.0, 300, 1900]], c: [560, 1250] },
          { type: "pipe", p: [[5.0, 300, 1900], [5.5, 300, 2150], [6.5, 300, 3350], [7.0, 300, 3760], [7.5, 640, 3760], [7.75, 640, 3860]] },
          { type: "fall", p: [[7.75, 640, 3860], [8.25, 640, 4290]] },
          { type: "hang", p: [[8.25, 640, 4290], [8.5, 640, 4300]] },
          { type: "pipe", p: [[8.5, 640, 4300], [9.75, 640, 5500], [9.9, 540, 5500], [10.0, 540, 5600]] },
          { type: "fall", p: [[10.0, 540, 5600], [10.5, 540, 6185]] }
        ];
        var T = { soil: 2.5, spray: 4.0, crops: 4.5, tank: 6.5, tap: 7.75, bucket: 8.25, urli: 10.5, wish: 12.0 };
        function dropAt(t) {
          for (var i = 0; i < SEG.length; i++) {
            var s = SEG[i], p = s.p, t0 = p[0][0], t1 = p[p.length - 1][0];
            if (t < t0 && i === 0) return [p[0][1], p[0][2]];
            if (t > t1) continue;
            if (s.type === "arc") { var u = (t - t0) / (t1 - t0), a = p[0], b = p[1], c = s.c; return [(1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * c[0] + u * u * b[1], (1 - u) * (1 - u) * a[2] + 2 * u * (1 - u) * c[1] + u * u * b[2]]; }
            for (var j = 1; j < p.length; j++) if (t <= p[j][0]) { var k = (t - p[j - 1][0]) / (p[j][0] - p[j - 1][0]); if (s.type === "fall") k = k * k; return [MM.lerp(p[j - 1][1], p[j][1], k), MM.lerp(p[j - 1][2], p[j][2], k)]; }
          }
          var L = SEG[SEG.length - 1].p; return [L[L.length - 1][1], L[L.length - 1][2]];
        }
        function camAt(t) {
          var y = 0, n = 0; for (var d = -0.3; d <= 0.3001; d += 0.1) { y += dropAt(Math.max(0, t + d))[1]; n++; }
          var c = Math.max(0, y / n - 900);
          return MM.lerp(c, 4750, MM.inOut(MM.seg(t, T.urli, T.urli + 1.1)));   // settle with the urli low in frame for the wish
        }
        var defs = el("defs", {}, sc);
        var lg = el("linearGradient", { id: "world", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        [[0, "#3d4f66"], [0.22, "#6f8aa3"], [0.272, "#bcd7c9"], [0.2725, "#5b3a1e"], [0.34, "#3b2513"], [0.47, "#2a2030"], [0.66, "#241630"], [0.8, "#1a0b20"], [1, "#0c0410"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, lg); });
        var gl = el("filter", { id: "glow", x: "-80%", y: "-80%", width: "260%", height: "260%" }, defs);
        el("feGaussianBlur", { stdDeviation: 9, result: "b" }, gl); var mg = el("feMerge", {}, gl); el("feMergeNode", { in: "b" }, mg); el("feMergeNode", { in: "SourceGraphic" }, mg);
        var hg = el("radialGradient", { id: "halo" }, defs); [["0%", "rgb(255 190 70 / 0.65)"], ["100%", "rgb(255 190 70 / 0)"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, hg); });
        var bg2 = el("linearGradient", { id: "brass", x1: 0, y1: 0, x2: 0, y2: 1 }, defs); [["0%", "#f7d36b"], ["55%", "#c98f1c"], ["100%", "#7a4f08"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, bg2); });
        var world = el("g", {}, sc);
        el("rect", { x: -200, y: -200, width: 1480, height: 7200, fill: "url(#world)" }, world);
        function label(txt, y, col) { var t = el("text", { x: 70, y: y, "font-size": 34, fill: col || "#fbf3e2", "letter-spacing": "9", opacity: 0.8 }, world); t.textContent = txt; return t; }
        // ---- 1 · monsoon ----
        label("MONSOON", 300);
        var rain = []; for (var i = 0; i < 44; i++) rain.push(el("line", { stroke: "#cfe4f2", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.55 }, world));
        var cloud = el("g", {}, world);
        [[540, 430, 190, 90], [400, 460, 130, 70], [690, 460, 140, 75], [470, 380, 110, 70], [620, 375, 120, 75]].forEach(function (c) { el("ellipse", { cx: c[0], cy: c[1], rx: c[2], ry: c[3], fill: "#dfe8ef" }, cloud); });
        // ---- 2 · farms ----
        label("FARMS", 1700, "#1f2a33");
        el("rect", { x: -200, y: 1900, width: 1480, height: 26, fill: "#4f7a2a" }, world);
        var crops = [140, 250, 360, 470, 600, 700].map(function (x, i) { var g = el("g", {}, world); el("path", { d: "M0 0 C-4 -50 4 -90 0 -130 M0 -60 C-34 -76 -46 -104 -40 -124 C-16 -116 -4 -92 0 -70 M0 -90 C30 -104 44 -128 40 -150 C18 -142 4 -120 0 -100", fill: "none", stroke: "#3f9a3a", "stroke-width": 11, "stroke-linecap": "round" }, g); return { g: g, x: x, t: T.crops + i * 0.125 }; });
        // ---- 3 · homes ----
        label("HOMES", 3180);
        el("rect", { x: 220, y: 3230, width: 160, height: 190, rx: 16, fill: "#1c1c22", stroke: "#0c0c10", "stroke-width": 6 }, world);      // roof tank
        [3275, 3320, 3365].forEach(function (y) { el("line", { x1: 222, y1: y, x2: 378, y2: y, stroke: "#33333d", "stroke-width": 5 }, world); });
        el("rect", { x: 110, y: 3420, width: 860, height: 40, fill: "#6b4a3a", stroke: "#2b1a10", "stroke-width": 6 }, world);                   // roof slab
        var wall = el("rect", { x: 130, y: 3460, width: 820, height: 900, fill: "#e9d6b4", stroke: "#2b1a10", "stroke-width": 6 }, world);
        el("rect", { x: 110, y: 4360, width: 860, height: 40, fill: "#6b4a3a", stroke: "#2b1a10", "stroke-width": 6 }, world);                   // floor
        var wins = [[300, 4040], [880, 3700]].map(function (w) { var r = el("rect", { x: w[0] - 90, y: w[1] - 110, width: 180, height: 220, rx: 10, fill: "#33405e", stroke: "#2b1a10", "stroke-width": 6 }, world); el("line", { x1: w[0], y1: w[1] - 110, x2: w[0], y2: w[1] + 110, stroke: "#2b1a10", "stroke-width": 5 }, world); return r; });
        // ---- pipes: grey first, then a blue fill that follows the drop ----
        var pipes = SEG.filter(function (s) { return s.type === "pipe"; }).map(function (s) {
          var d = "M" + s.p.map(function (q) { return q[1] + " " + q[2]; }).join(" L");
          var pg = el("g", {}, world);
          el("path", { d: d, fill: "none", stroke: "#4a535d", "stroke-width": 40, "stroke-linejoin": "round", "stroke-linecap": "round" }, pg);
          el("path", { d: d, fill: "none", stroke: "#dfe6ea", "stroke-width": 28, "stroke-linejoin": "round", "stroke-linecap": "round" }, pg);
          var cum = [0]; for (var j = 1; j < s.p.length; j++) cum.push(cum[j - 1] + Math.hypot(s.p[j][1] - s.p[j - 1][1], s.p[j][2] - s.p[j - 1][2]));
          var wet = el("path", { d: d, fill: "none", stroke: "#2fb6d6", "stroke-width": 20, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": cum[cum.length - 1] + " " + cum[cum.length - 1] }, pg);
          return { s: s, cum: cum, wet: wet, g: pg };
        });
        // sprinkler head, tap, bucket (drawn over the pipes)
        el("rect", { x: 796, y: 1756, width: 48, height: 40, rx: 8, fill: "#2b2b33" }, world); el("rect", { x: 770, y: 1742, width: 100, height: 18, rx: 9, fill: "#f26b1d" }, world);
        var spray = []; for (var k = 0; k < 16; k++) spray.push(el("circle", { r: 9, fill: "#8fdcf0" }, world));
        el("path", { d: "M585 3860 L695 3860 L695 3884 L662 3884 L662 3900 L618 3900 L618 3884 L585 3884 Z", fill: "#c98f1c", stroke: "#3b2203", "stroke-width": 5 }, world);
        el("rect", { x: 628, y: 3828, width: 24, height: 34, fill: "#c98f1c", stroke: "#3b2203", "stroke-width": 5 }, world); el("rect", { x: 600, y: 3812, width: 80, height: 20, rx: 10, fill: "#b3122b", stroke: "#3b2203", "stroke-width": 5 }, world);
        var water = el("rect", { x: 556, y: 4340, width: 168, height: 0, fill: "#2fb6d6" }, world);
        el("path", { d: "M540 4190 L740 4190 L716 4360 L564 4360 Z", fill: "none", stroke: "#8b96a0", "stroke-width": 10, "stroke-linejoin": "round" }, world);
        var splash = [0, 1, 2].map(function () { return el("ellipse", { fill: "none", stroke: "#8fdcf0", "stroke-width": 6 }, world); });
        // ---- 4 · diwali, then the new year ----
        var lblD = label("DIWALI", 5850);
        var glowU = el("circle", { cx: 540, cy: 6200, r: 620, fill: "url(#halo)" }, world);
        el("ellipse", { cx: 540, cy: 6200, rx: 300, ry: 50, fill: "#a8740f" }, world);
        var surf = el("ellipse", { cx: 540, cy: 6200, rx: 276, ry: 40, fill: "#1f8fb0" }, world);
        var rip = [0, 1, 2].map(function () { return el("ellipse", { cx: 540, cy: 6200, fill: "none", stroke: "#bfeaf5", "stroke-width": 5 }, world); });
        [[420, 6196, "#f5a300"], [650, 6204, "#d6246e"], [540, 6216, "#f26b1d"]].forEach(function (f) { for (var p = 0; p < 8; p++) { var a = p / 8 * Math.PI * 2; el("ellipse", { cx: (f[0] + Math.cos(a) * 20).toFixed(1), cy: (f[1] + Math.sin(a) * 7).toFixed(1), rx: 13, ry: 6, fill: f[2] }, world); } el("ellipse", { cx: f[0], cy: f[1], rx: 10, ry: 4, fill: "#fff4c2" }, world); });
        el("path", { d: "M240 6200 C 270 6420, 810 6420, 840 6200 A 300 50 0 0 1 240 6200 Z", fill: "url(#brass)", stroke: "#3b2203", "stroke-width": 6 }, world);
        el("path", { d: "M240 6200 A 300 50 0 0 0 840 6200", fill: "none", stroke: "#ffe7a0", "stroke-width": 12, "stroke-linecap": "round" }, world);
        var diyas = [[90, 6150, 10.5], [990, 6150, 10.5], [230, 6400, 11.0], [850, 6400, 11.0], [440, 6470, 11.5], [640, 6470, 11.5]].map(function (d) { return { im: el("image", { href: "assets/img/st-diya.png", x: d[0] - 90, y: d[1] - 94, width: 180, height: 188 }, world), x: d[0], y: d[1], t: d[2] }; });
        // ---- the drop ----
        var drop = el("g", {}, world);
        el("path", { d: "M0 -40 C 22 -10 28 6 28 16 A28 28 0 1 1 -28 16 C -28 6 -22 -10 0 -40 Z", fill: "#2fb6d6", stroke: "#0b5d63", "stroke-width": 5 }, drop);
        el("ellipse", { cx: -9, cy: 12, rx: 6, ry: 11, fill: "#d8f5fb", opacity: 0.9 }, drop);
        var endCard = MM.endCard(document.getElementById("end"), 430);

        function render(t) {
          var cam = camAt(t); world.setAttribute("transform", "translate(0 " + (-cam).toFixed(1) + ")");
          var p = dropAt(t), q = dropAt(t + 0.02), ang = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI - 90;
          var still = Math.hypot(q[0] - p[0], q[1] - p[1]) < 0.3, grow = MM.back(MM.seg(t, 0.5, 1.3), 1.6);
          drop.setAttribute("transform", "translate(" + p[0].toFixed(1) + " " + p[1].toFixed(1) + ") rotate(" + (still ? 0 : ang).toFixed(1) + ") scale(" + (grow * (t >= T.urli ? 0 : 1)).toFixed(3) + ")");
          drop.setAttribute("opacity", t >= 8.27 && t < 8.5 ? 0 : 1);
          // rain and cloud
          rain.forEach(function (r, i) { var x = MM.rnd(i) * 1080, ph = (t * (1.1 + 0.6 * MM.rnd(i + 5)) + MM.rnd(i + 9)) % 1, y = 560 + ph * 1340; r.setAttribute("x1", x.toFixed(0)); r.setAttribute("x2", (x - 8).toFixed(0)); r.setAttribute("y1", y.toFixed(0)); r.setAttribute("y2", (y + 46).toFixed(0)); });
          cloud.setAttribute("transform", "translate(" + (14 * Math.sin(t * 0.8)).toFixed(1) + " 0)");
          // pipes fill with water as the drop passes
          pipes.forEach(function (pp) {
            var s = pp.s.p, len = 0;
            if (t >= s[s.length - 1][0]) len = pp.cum[pp.cum.length - 1];
            else for (var j = 1; j < s.length; j++) if (t <= s[j][0]) { if (t > s[j - 1][0]) len = pp.cum[j - 1] + (pp.cum[j] - pp.cum[j - 1]) * (t - s[j - 1][0]) / (s[j][0] - s[j - 1][0]); else len = t < s[0][0] ? 0 : pp.cum[j - 1]; break; }
            pp.wet.setAttribute("stroke-dashoffset", (pp.cum[pp.cum.length - 1] - len).toFixed(1));
          });
          // sprinkler spray and crops
          spray.forEach(function (c, k) {
            var age = ((t - T.spray) * 1.6 + k / 16) % 1, on = t >= T.spray && t < T.spray + 1.5, side = k % 2 ? 1 : 0.62;
            var x = 820 - 520 * side * age, y = 1790 - 4 * 540 * side * age * (1 - age) * 0.55 + 110 * age;
            c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("opacity", on ? (1 - age * 0.6).toFixed(2) : 0);
          });
          crops.forEach(function (c) { var k = MM.back(MM.seg(t, c.t, c.t + 0.3), 1.8); c.g.setAttribute("transform", "translate(" + c.x + " 1902) scale(" + k.toFixed(3) + ")"); });
          // bucket fills, windows light
          var kb = MM.out3(MM.seg(t, T.bucket, T.bucket + 0.4)); water.setAttribute("y", (4352 - 70 * kb).toFixed(1)); water.setAttribute("height", (70 * kb).toFixed(1));
          splash.forEach(function (s, i) { var a = MM.seg(t, T.bucket + i * 0.08, T.bucket + i * 0.08 + 0.45); s.setAttribute("cx", 640); s.setAttribute("cy", 4282); s.setAttribute("rx", (20 + 90 * a).toFixed(1)); s.setAttribute("ry", (6 + 22 * a).toFixed(1)); s.setAttribute("opacity", a > 0 && a < 1 ? (1 - a).toFixed(2) : 0); });
          var kw = MM.seg(t, T.bucket, T.bucket + 0.3); wins.forEach(function (w) { w.setAttribute("fill", "rgb(" + Math.round(MM.lerp(51, 255, kw)) + " " + Math.round(MM.lerp(64, 206, kw)) + " " + Math.round(MM.lerp(94, 102, kw)) + ")"); });
          // urli: ripples, diyas light pair by pair, warm glow
          rip.forEach(function (r, i) { var a = MM.seg(t, T.urli + i * 0.15, T.urli + i * 0.15 + 0.8); r.setAttribute("rx", (20 + 250 * a).toFixed(1)); r.setAttribute("ry", (4 + 34 * a).toFixed(1)); r.setAttribute("opacity", a > 0 && a < 1 ? (1 - a).toFixed(2) : 0); });
          glowU.setAttribute("opacity", (MM.seg(t, T.urli, T.urli + 1.2) * (0.9 + 0.1 * Math.sin(t * 7))).toFixed(3));
          diyas.forEach(function (d) { var k = MM.back(MM.seg(t, d.t, d.t + 0.3), 1.9); d.im.setAttribute("opacity", t < d.t ? 0 : 1); d.im.setAttribute("transform", "translate(" + d.x + " " + d.y + ") scale(" + k.toFixed(3) + ") translate(" + -d.x + " " + -d.y + ")"); });
          // the last pipe and the season label clear away before the wish
          var clear = (1 - MM.seg(t, T.urli + 0.2, T.urli + 0.9)).toFixed(3);
          pipes[pipes.length - 1].g.setAttribute("opacity", clear); lblD.setAttribute("opacity", (0.8 * clear).toFixed(3));
          endCard(t, T.wish - 0.4, T.wish);
        }
        Promise.all([document.fonts.load('800 80px "Baloo Gujarati"', "સાલ"), document.fonts.load('600 80px "Baloo Gujarati"', "સાલ"), document.fonts.ready].concat([].map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : 0; }))).then(function () {
          var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
          tl.to(clock, { t: 16, duration: 16, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
