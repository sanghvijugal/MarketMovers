<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Nutan Varsh: nava chopda</title>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/nv.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Baloo Gujarati"; src: url("assets/fonts/baloo-bhai-2-gujarati-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Baloo Gujarati"; src: url("assets/fonts/baloo-bhai-2-gujarati-800-normal.woff2") format("woff2"); font-weight: 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2a040b; }
      body { font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #7a1424 0%, #4a0a14 55%, #2a040b 100%); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Geist", sans-serif; }
      svg text.gu { font-family: "Baloo Gujarati", sans-serif; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="16" data-track-index="1">
        <div id="night" style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, #2b1238 0%, #150822 55%, #07030d 100%);opacity:0"></div>
        <svg id="fw" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <svg id="book" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <div id="end"></div>
      </section>
      <!-- original soundtrack generated by ../make_audio.py from the same timings: santoor, shehnai, dholak, bells, firework whistles and bursts -->
      <audio id="music" src="assets/audio/chopda.wav" data-start="0" data-duration="16" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        var el = MM.el, svg = document.getElementById("book");
        // ---- timings (seconds; a beat every 0.5 s). Keep in step with make_audio.py ----
        var T = { land: 0.5, open: 1.5, shubh: 2.0, labh: 2.5, sathiya: 3.0, dots: 4.0, entries: 4.5, close: 8.5, badge: 8.9, wish: 12.0 };
        var BURSTS = [[9.5, 250, 900], [10.0, 830, 820], [10.5, 540, 1180], [11.0, 220, 1380], [11.5, 860, 1330], [12.0, 200, 1330], [12.0, 880, 1330], [12.75, 330, 1600], [13.5, 780, 1560], [14.25, 540, 1480], [14.75, 240, 1500], [15.25, 840, 1520]];
        var BX = 220, BY = 520, BW = 640, BH = 900;
        var book = el("g", {}, svg);
        // page (cream ledger paper with a red margin line)
        var page = el("g", {}, book);
        el("rect", { x: BX, y: BY, width: BW, height: BH, rx: 14, fill: "#fbf3e2", stroke: "#2b1a10", "stroke-width": 6 }, page);
        el("line", { x1: BX + 24, y1: BY + 20, x2: BX + 24, y2: BY + BH - 20, stroke: "#c8102e", "stroke-width": 3, opacity: 0.5 }, page);
        el("line", { x1: BX + BW - 24, y1: BY + 20, x2: BX + BW - 24, y2: BY + BH - 20, stroke: "#c8102e", "stroke-width": 3, opacity: 0.5 }, page);
        var shubh = el("text", { class: "gu", x: BX + 150, y: BY + 122, "text-anchor": "middle", "font-size": 92, fill: "#c8102e" }, page); shubh.textContent = "શુભ";
        var labh = el("text", { class: "gu", x: BX + 490, y: BY + 122, "text-anchor": "middle", "font-size": 92, fill: "#c8102e" }, page); labh.textContent = "લાભ";
        // sathiya drawn in kumkum, then four dots
        var sg = el("g", { transform: "translate(" + (BX + 320) + " " + (BY + 290) + ")" }, page);
        var ARMS = ["M0 0 L0 -78 L78 -78", "M0 0 L78 0 L78 78", "M0 0 L0 78 L-78 78", "M0 0 L-78 0 L-78 -78"].map(function (d) { return el("path", { d: d, fill: "none", stroke: "#c8102e", "stroke-width": 20, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "156 156" }, sg); });
        var DOTS = [[38, -38], [38, 38], [-38, 38], [-38, -38]].map(function (p) { return el("circle", { cx: p[0], cy: p[1], r: 11, fill: "#c8102e" }, sg); });
        // ledger: pipe rules grow under each row, brand names tick in like entries
        var NAMES = ["FINOLEX", "ASTRAL", "DUTRON", "SINTEX", "TEXMO", "VECTUS", "WATERFLO", "JOHNSON BATHROOMS", "KISAN", "PLASTO", "MBH", "REWA", "RECO"];
        var rows = [], ROW0 = BY + 455, RH = 60;
        for (var r = 0; r < 7; r++) {
          var y = ROW0 + r * RH + 20, g = el("g", {}, page);
          el("line", { x1: BX + 44, y1: y, x2: BX + BW - 44, y2: y, stroke: "#56606a", "stroke-width": 12, "stroke-linecap": "round" }, g);
          el("line", { x1: BX + 44, y1: y, x2: BX + BW - 44, y2: y, stroke: "#e6ecef", "stroke-width": 6, "stroke-linecap": "round" }, g);
          rows.push(g);
        }
        var entries = NAMES.map(function (nm, i) {
          var col = i % 2, r = Math.floor(i / 2), x = BX + 56 + col * 290, y = ROW0 + r * RH, g = el("g", {}, page);
          el("path", { d: "M" + x + " " + (y - 12) + " l9 10 l17 -22", fill: "none", stroke: "#0b5d63", "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
          var tx = el("text", { x: x + 38, y: y, "font-size": nm.length > 9 ? 17 : 27, "font-weight": 700, fill: "#2b1a10", "letter-spacing": "1" }, g); tx.textContent = nm;
          return { g: g, t: T.entries + i * 0.25, x: x, y: y };
        });
        // cover: red cloth with a gold border, hinged at the top like a traditional chopda
        var cover = el("g", {}, book);
        el("rect", { x: BX - 8, y: BY - 8, width: BW + 16, height: BH + 16, rx: 18, fill: "#b3122b", stroke: "#2b1a10", "stroke-width": 6 }, cover);
        el("rect", { x: BX + 26, y: BY + 26, width: BW - 52, height: BH - 52, rx: 10, fill: "none", stroke: "#f5c542", "stroke-width": 6 }, cover);
        el("rect", { x: BX + 44, y: BY + 44, width: BW - 88, height: BH - 88, rx: 6, fill: "none", stroke: "#f5c542", "stroke-width": 2, "stroke-dasharray": "4 10" }, cover);
        var cv = el("text", { class: "gu", x: 540, y: BY + 400, "text-anchor": "middle", "font-size": 110, fill: "#f5c542" }, cover); cv.textContent = "શ્રી";
        var cv2 = el("text", { x: 540, y: BY + 520, "text-anchor": "middle", "font-size": 34, "font-weight": 700, fill: "#f5c542", "letter-spacing": "8" }, cover); cv2.textContent = "2083";
        // binding strip stays at the top when the cover lifts
        el("rect", { x: BX - 8, y: BY - 26, width: BW + 16, height: 40, rx: 12, fill: "#7a0d1e", stroke: "#2b1a10", "stroke-width": 6 }, book);
        [0, 1, 2, 3, 4].forEach(function (k) { el("circle", { cx: BX + 80 + k * 120, cy: BY - 6, r: 7, fill: "#f5c542" }, book); });

        // ---- fireworks made of fittings ----
        var fw = document.getElementById("fw"), COLS = ["#f5c542", "#fbf3e2", "#5aa9ae", "#f26b1d", "#ff7aa8"];
        var FW = BURSTS.map(function (b, bi) {
          var g = el("g", {}, fw), trail = el("line", { stroke: "#fbf3e2", "stroke-width": 7, "stroke-linecap": "round" }, g), parts = [];
          var n = 18;
          for (var k = 0; k < n; k++) {
            var col = COLS[(k + bi) % COLS.length], pg = el("g", {}, g), kind = (k + bi) % 3;
            if (kind === 0) el("path", { d: "M-14 12 L-14 -4 Q-14 -14 -4 -14 L12 -14", fill: "none", stroke: col, "stroke-width": 11, "stroke-linecap": "round" }, pg);      // elbow
            else if (kind === 1) el("path", { d: "M-16 0 L16 0 M0 0 L0 16", fill: "none", stroke: col, "stroke-width": 11, "stroke-linecap": "round" }, pg);            // tee
            else el("circle", { r: 11, fill: "none", stroke: col, "stroke-width": 8 }, pg);                                                                                  // pipe ring
            parts.push({ g: pg, a: (k / n) * Math.PI * 2 + bi, sp: 0.75 + 0.5 * MM.rnd(bi * 31 + k), rot: 360 * MM.rnd(bi * 7 + k) });
          }
          return { g: g, trail: trail, parts: parts, t: b[0], x: b[1], y: b[2], R: bi === 5 || bi === 6 ? 250 : 300 };
        });
        var endCard = MM.endCard(document.getElementById("end"), 430);

        function render(t) {
          // book: drops in, opens, closes, then shrinks into the logo badge
          var drop = MM.back(MM.seg(t, 0.15, T.land + 0.12), 1.2), ks = MM.inOut(MM.seg(t, T.close + 0.3, T.badge + 0.25));
          var by = -1700 * (1 - drop), sc = MM.lerp(1, 0.28, ks), cy = MM.lerp(970, 430, ks);
          book.setAttribute("transform", "translate(540 " + (cy + by).toFixed(1) + ") scale(" + sc.toFixed(4) + ") translate(-540 -970)");
          book.setAttribute("opacity", (1 - MM.seg(t, T.badge, T.badge + 0.25)).toFixed(3));
          var open = MM.inOut(MM.seg(t, T.open, T.open + 0.4)) - MM.inOut(MM.seg(t, T.close, T.close + 0.3));
          cover.setAttribute("transform", "translate(0 " + (BY - 8) + ") scale(1 " + Math.max(0.0001, 1 - open).toFixed(4) + ") translate(0 " + -(BY - 8) + ")");
          cover.setAttribute("opacity", open > 0.98 ? 0 : 1);
          var pop = function (node, t0, cx, cy2) { var k = MM.back(MM.seg(t, t0, t0 + 0.22), 2); node.setAttribute("opacity", t < t0 ? 0 : 1); node.setAttribute("transform", "translate(" + cx + " " + cy2 + ") scale(" + k.toFixed(3) + ") translate(" + -cx + " " + -cy2 + ")"); };
          pop(shubh, T.shubh, BX + 150, BY + 95); pop(labh, T.labh, BX + 490, BY + 95);
          ARMS.forEach(function (a, i) { var k = MM.seg(t, T.sathiya + i * 0.25, T.sathiya + i * 0.25 + 0.25); a.setAttribute("stroke-dashoffset", (156 * (1 - k)).toFixed(1)); a.setAttribute("opacity", k > 0 ? 1 : 0); });
          DOTS.forEach(function (d, i) { var k = MM.back(MM.seg(t, T.dots + i * 0.06, T.dots + i * 0.06 + 0.18), 2.5); d.setAttribute("r", (11 * k).toFixed(2)); });
          rows.forEach(function (g, r) { var k = MM.out3(MM.seg(t, T.entries + r * 0.5 - 0.1, T.entries + r * 0.5 + 0.3)); g.setAttribute("transform", "translate(" + (BX + 44) + " 0) scale(" + k.toFixed(4) + " 1) translate(" + -(BX + 44) + " 0)"); g.setAttribute("opacity", k > 0 ? 1 : 0); });
          entries.forEach(function (e) { var k = MM.back(MM.seg(t, e.t, e.t + 0.16), 2.2); e.g.setAttribute("opacity", t < e.t ? 0 : 1); e.g.setAttribute("transform", "translate(" + e.x + " " + e.y + ") scale(" + k.toFixed(3) + ") translate(" + -e.x + " " + -e.y + ")"); });
          // night falls for the fireworks
          document.getElementById("night").style.opacity = MM.seg(t, T.close + 0.2, T.badge + 0.5).toFixed(3);
          FW.forEach(function (f) {
            var tr = MM.seg(t, f.t - 0.45, f.t), age = t - f.t;
            if (t < f.t - 0.45 || age > 1.5) { f.g.setAttribute("display", "none"); return; }
            f.g.setAttribute("display", "inline");
            var ry = MM.lerp(1920, f.y, MM.out3(tr));
            f.trail.setAttribute("x1", f.x); f.trail.setAttribute("x2", f.x); f.trail.setAttribute("y1", ry.toFixed(1)); f.trail.setAttribute("y2", Math.min(1920, ry + 150).toFixed(1));
            f.trail.setAttribute("opacity", age >= 0 ? 0 : 0.9);
            var e = MM.out3(MM.clamp(age / 0.9)), fade = 1 - MM.seg(age, 0.6, 1.4);
            f.parts.forEach(function (p) {
              if (age < 0) { p.g.setAttribute("opacity", 0); return; }
              var r = f.R * p.sp * e, x = f.x + Math.cos(p.a) * r, y = f.y + Math.sin(p.a) * r + 160 * age * age;
              p.g.setAttribute("opacity", fade.toFixed(3));
              p.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + (p.rot + age * 200).toFixed(1) + ") scale(" + (2.5 - 0.8 * e).toFixed(3) + ")");
            });
          });
          endCard(t, T.badge, T.wish);
          document.getElementById("stage").style.transform = "scale(" + (1 + 0.025 * MM.seg(t, T.wish, 16)).toFixed(4) + ")";
        }
        Promise.all([document.fonts.load('800 80px "Baloo Gujarati"', "શુભ"), document.fonts.load('600 80px "Baloo Gujarati"', "શુભ"), document.fonts.ready]).then(function () {
          var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
          tl.to(clock, { t: 16, duration: 16, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
