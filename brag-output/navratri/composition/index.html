<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Navratri</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Plex Hindi"; src: url("assets/fonts/ibm-plex-sans-devanagari-devanagari-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Plex Hindi"; src: url("assets/fonts/ibm-plex-sans-devanagari-devanagari-600-normal.woff2") format("woff2"); font-weight: 600; }
      :root { --kumkum: #b3122b; --marigold: #f5a300; --saffron: #f26b1d; --magenta: #d6246e; --teal: #0b5d63; --teal-l: #5aa9ae; --cream: #fbf3e2; --ink: #111111; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--kumkum); }
      body { font-family: "Geist", "Plex Hindi", sans-serif; -webkit-font-smoothing: antialiased; color: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--kumkum); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .hi { font-family: "Plex Hindi", sans-serif; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }
      svg { overflow: visible; }

      /* toran: hanging marigold strands across the top */
      #toran { z-index: 40; pointer-events: none; }
      .strand { position: absolute; top: -20px; width: 60px; transform-origin: 50% 0; }
      /* 1: hook */
      #s1 { background: radial-gradient(circle at 50% 45%, #d32a3e, #8e0d22 75%); }
      #s1-title { top: 1030px; font-size: 168px; font-weight: 600; line-height: 1.1; color: var(--cream); text-shadow: 0 10px 0 rgb(0 0 0 / 0.12); }
      #s1-sub { top: 1280px; font-size: 40px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--marigold); font-weight: 600; }
      .stick { position: absolute; left: 540px; top: 760px; width: 46px; height: 560px; margin: -280px 0 0 -23px; transform-origin: 50% 50%; }
      .spark { position: absolute; left: 540px; top: 560px; width: 0; height: 0; }
      .spark i { position: absolute; left: -4px; top: -60px; width: 8px; height: 46px; border-radius: 4px; background: var(--marigold); transform-origin: 4px 60px; }
      /* 2: rangoli */
      #s2 { background: radial-gradient(circle at 50% 50%, #0e7078, #073b3f 80%); }
      .mandala { position: absolute; left: 540px; top: 960px; width: 0; height: 0; }
      .mandala svg { position: absolute; left: -500px; top: -500px; width: 1000px; height: 1000px; }
      /* 3: nine colours */
      #s3 { background: var(--ink); }
      .cshot { position: absolute; inset: 0; display: none; }
      .cshot .photo { position: absolute; inset: 0; }
      .cshot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .cshot .tint { position: absolute; inset: 0; mix-blend-mode: color; }
      .cshot .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.45), rgb(0 0 0 / 0) 30%, rgb(0 0 0 / 0) 65%, rgb(0 0 0 / 0.55)); }
      .cshot .cname { position: absolute; left: 0; right: 0; bottom: 230px; text-align: center; font-size: 64px; font-weight: 600; color: #fff; }
      .cshot .chip { position: absolute; left: 50%; bottom: 150px; width: 120px; height: 24px; margin-left: -60px; border-radius: 12px; }
      /* 4: wish */
      #s4 { background: radial-gradient(circle at 50% 38%, #fff8e8, #f6e3bd 80%); color: var(--ink); }
      #s4 .mandala { top: 760px; }
      #s4-mark { position: absolute; left: 540px; top: 760px; width: 230px; margin: -112px 0 0 -115px; }
      #s4-l1 { top: 1310px; font-size: 62px; font-weight: 600; color: var(--kumkum); line-height: 1.25; }
      #s4-l2 { top: 1395px; font-size: 62px; font-weight: 600; color: var(--kumkum); line-height: 1.25; }
      #s4-en { top: 1530px; font-size: 34px; color: #5a3b2e; }
      /* 5: end */
      #s5 { background: radial-gradient(circle at 50% 40%, #13706f, #062e31 85%); }
      #s5-lock { position: absolute; left: 0; right: 0; top: 760px; display: flex; flex-direction: column; align-items: center; }
      #s5-name { margin-top: 44px; font-size: 104px; font-weight: 700; letter-spacing: -0.045em; color: var(--cream); }
      #s5-hi { top: 1215px; font-size: 64px; font-weight: 600; color: var(--marigold); }
      #s5-url { top: 1345px; font-size: 32px; letter-spacing: 0.16em; text-transform: uppercase; color: #cfe7e6; }
      .diya { position: absolute; top: 1560px; width: 170px; height: 150px; margin-left: -85px; }
      .flame { transform-origin: 85px 70px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.5" data-width="1080" data-height="1920">
      <section id="s1" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="spark" id="spark1"></div>
        <svg class="stick" id="stickL" viewBox="0 0 46 560"></svg>
        <svg class="stick" id="stickR" viewBox="0 0 46 560"></svg>
        <p class="center hi" id="s1-title">शुभ नवरात्रि</p>
        <p class="center" id="s1-sub">Happy Navratri</p>
      </section>

      <section id="s2" class="clip" data-start="2.5" data-duration="2" data-track-index="1">
        <div class="mandala" id="m2"></div>
      </section>

      <section id="s3" class="clip" data-start="4.5" data-duration="4.5" data-track-index="1">
        <div id="shots"></div>
      </section>

      <section id="s4" class="clip" data-start="9" data-duration="3.5" data-track-index="1">
        <div class="mandala" id="m4"></div>
        <svg id="s4-mark" class="mm" data-inner="#111111" data-outer="#0b5d63"></svg>
        <p class="center hi" id="s4-l1">मार्केट मूवर्स परिवार की ओर से</p>
        <p class="center hi" id="s4-l2">नवरात्रि की हार्दिक शुभकामनाएँ</p>
        <p class="center" id="s4-en">Warm Navratri wishes from the Market Movers family</p>
      </section>

      <section id="s5" class="clip" data-start="12.5" data-duration="4" data-track-index="1">
        <div id="s5-lock"><svg class="mm" data-inner="#fbf3e2" data-outer="#5aa9ae" style="width:230px;height:auto"></svg><p id="s5-name">Market Movers</p></div>
        <p class="center hi" id="s5-hi">शुभ नवरात्रि</p>
        <p class="center" id="s5-url">Marhatal, Jabalpur · marketmovers.co.in</p>
        <div id="diyas"></div>
      </section>

      <section id="toran" class="clip" data-start="0" data-duration="16.5" data-track-index="0"></section>

      <!-- garba-style track composed for this reel (6/8, a bar per second): dhol, dandiya, manjira, tanpura, harmonium -->
      <audio id="music" src="assets/audio/garba-market-movers.wav" data-start="0" data-duration="16.5" data-track-index="10" data-volume="1"></audio>
      <audio id="sx0" src="assets/audio/impactWood_light_000.ogg" data-start="0.5" data-duration="0.265" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sx1" src="assets/audio/impactWood_medium_001.ogg" data-start="1.0" data-duration="0.333" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sx2" src="assets/audio/impactWood_light_002.ogg" data-start="1.5" data-duration="0.265" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sx3" src="assets/audio/impactWood_light_000.ogg" data-start="4.5" data-duration="0.265" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sx4" src="assets/audio/impactWood_light_001.ogg" data-start="5.0" data-duration="0.265" data-track-index="15" data-volume="0.3"></audio>
      <audio id="sx5" src="assets/audio/impactWood_light_002.ogg" data-start="5.5" data-duration="0.265" data-track-index="16" data-volume="0.3"></audio>
      <audio id="sx6" src="assets/audio/impactWood_light_003.ogg" data-start="6.0" data-duration="0.265" data-track-index="17" data-volume="0.3"></audio>
      <audio id="sx7" src="assets/audio/impactWood_light_004.ogg" data-start="6.5" data-duration="0.265" data-track-index="18" data-volume="0.3"></audio>
      <audio id="sx8" src="assets/audio/impactWood_light_000.ogg" data-start="7.0" data-duration="0.265" data-track-index="19" data-volume="0.3"></audio>
      <audio id="sx9" src="assets/audio/impactWood_light_001.ogg" data-start="7.5" data-duration="0.265" data-track-index="20" data-volume="0.3"></audio>
      <audio id="sx10" src="assets/audio/impactWood_light_002.ogg" data-start="8.0" data-duration="0.265" data-track-index="21" data-volume="0.3"></audio>
      <audio id="sx11" src="assets/audio/impactWood_light_003.ogg" data-start="8.5" data-duration="0.265" data-track-index="22" data-volume="0.3"></audio>
      <audio id="sx12" src="assets/audio/impactBell_heavy_000.ogg" data-start="9.45" data-duration="1.48" data-track-index="23" data-volume="0.45"></audio>
      <audio id="sx13" src="assets/audio/impactWood_medium_001.ogg" data-start="12.5" data-duration="0.333" data-track-index="24" data-volume="0.6"></audio>
    </div>

    <script>
      (function () {
        function rnd(s) { var x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); }

        // ---- marigold toran: strands of flowers with a leaf at the bottom ----
        function flower(cx, cy, r, c1, c2) {
          var p = "";
          for (var i = 0; i < 14; i++) { var a = i / 14 * Math.PI * 2; p += '<circle cx="' + (cx + Math.cos(a) * r * 0.62).toFixed(1) + '" cy="' + (cy + Math.sin(a) * r * 0.62).toFixed(1) + '" r="' + (r * 0.42).toFixed(1) + '" fill="' + c1 + '"/>'; }
          return p + '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.62) + '" fill="' + c2 + '"/><circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.22) + '" fill="#c25a00" opacity="0.6"/>';
        }
        var tor = "";
        for (var s = 0; s < 9; s++) {
          var n = 3 + (s % 2 ? 2 : 4), svg = '<svg class="strand" data-i="' + s + '" style="left:' + (s * 128 + 4) + 'px" width="60" height="' + (n * 52 + 90) + '" viewBox="0 0 60 ' + (n * 52 + 90) + '"><path d="M30 0 V' + (n * 52 + 20) + '" stroke="#5a3b12" stroke-width="2"/>';
          for (var k = 0; k < n; k++) svg += flower(30, 30 + k * 52, 26, k % 2 ? "#f5a300" : "#f26b1d", k % 2 ? "#ffc23a" : "#ff8a3d");
          svg += '<path d="M30 ' + (n * 52 + 10) + ' q22 20 0 70 q-22 -50 0 -70z" fill="#2f7d32"/></svg>';
          tor += svg;
        }
        tor += '<svg style="position:absolute;left:0;top:0" width="1080" height="40"><path d="M0 14 Q270 40 540 14 T1080 14" stroke="#5a3b12" stroke-width="4" fill="none"/></svg>';
        document.getElementById("toran").innerHTML = tor;

        // ---- dandiya sticks: striped, with mirror bands ----
        var STICK = '<rect x="3" y="0" width="40" height="560" rx="20" fill="#f5a300"/>' +
          [60, 150, 240, 330, 420].map(function (y, i) { return '<rect x="3" y="' + y + '" width="40" height="44" fill="' + ["#2f7d32", "#d6246e", "#1f4fbf", "#d6246e", "#2f7d32"][i] + '"/><rect x="8" y="' + (y + 50) + '" width="30" height="14" rx="3" fill="#e9eef2"/>'; }).join("") +
          '<rect x="3" y="0" width="12" height="560" rx="6" fill="#fff" opacity="0.25"/>';
        document.getElementById("stickL").innerHTML = STICK;
        document.getElementById("stickR").innerHTML = STICK;
        var sp = ""; for (var i = 0; i < 10; i++) sp += '<i style="transform:rotate(' + (i * 36) + 'deg)"></i>';
        document.getElementById("spark1").innerHTML = sp;

        // ---- rangoli mandala: rings of petals ----
        function mandala(colors, core) {
          var g = '<svg viewBox="-500 -500 1000 1000">';
          var rings = [[12, 430, 120, 60, colors[0]], [16, 330, 100, 44, colors[1]], [12, 240, 90, 40, colors[2]], [10, 160, 70, 30, colors[3]], [8, 95, 50, 22, colors[4]]];
          rings.forEach(function (r, ri) {
            g += '<g class="ring" data-r="' + ri + '">';
            for (var i = 0; i < r[0]; i++) {
              var a = i * 360 / r[0];
              g += '<path transform="rotate(' + a + ')" d="M0 ' + (-r[1] + r[2]) + ' C' + r[3] + ' ' + (-r[1] + r[2] * 0.6) + ' ' + r[3] * 0.6 + ' ' + (-r[1] + r[2] * 0.1) + ' 0 ' + (-r[1]) + ' C' + (-r[3] * 0.6) + ' ' + (-r[1] + r[2] * 0.1) + ' ' + (-r[3]) + ' ' + (-r[1] + r[2] * 0.6) + ' 0 ' + (-r[1] + r[2]) + 'Z" fill="' + r[4] + '"/>';
              g += '<circle transform="rotate(' + (a + 180 / r[0]) + ')" cx="0" cy="' + (-r[1] + r[2] * 0.35) + '" r="' + (r[3] * 0.18) + '" fill="#fbf3e2"/>';
            }
            g += "</g>";
          });
          return g + '<circle r="' + (core || 70) + '" fill="' + colors[5] + '"/></svg>';
        }
        document.getElementById("m2").innerHTML = mandala(["#f26b1d", "#f5a300", "#d6246e", "#fbf3e2", "#b3122b", "#f5a300"]);
        document.getElementById("m4").innerHTML = mandala(["#f5a300", "#f26b1d", "#d6246e", "#5aa9ae", "#b3122b", "#fbf3e2"], 165);

        // ---- nine colours: product photos (and, once downloaded, Navratri photos) tinted in each colour ----
        var NINE = [["नारंगी", "#f26b1d"], ["सफ़ेद", "#f4efe6"], ["लाल", "#c8102e"], ["नीला", "#1f4fbf"], ["पीला", "#f6c400"], ["हरा", "#1e9e4a"], ["स्लेटी", "#8a8a85"], ["बैंगनी", "#6a2c91"], ["मोर हरा", "#00897b"]];
        var PHOTOS = [["pipe-stack", "32% 50%"], ["fittings", "20% 50%"], ["hdpe-coil", "55% 50%"], ["tap", "62% 50%"], ["counter", "60% 50%"], ["pipe-stack", "70% 50%"], ["fittings", "80% 50%"], ["hdpe-coil", "25% 50%"], ["tap", "45% 50%"]];
        document.getElementById("shots").innerHTML = NINE.map(function (c, i) {
          var white = c[1] === "#f4efe6";
          return '<div class="cshot"><div class="photo"><img src="assets/img/' + PHOTOS[i][0] + '.jpg" alt="" style="object-position:' + PHOTOS[i][1] + ";filter:grayscale(1) contrast(1.2) " + (white ? "brightness(1.15)" : "") + '"/></div>' +
            (white ? "" : '<div class="tint" style="background:' + c[1] + '"></div>') + '<div class="shade"></div>' +
            '<p class="cname hi">' + c[0] + '</p><div class="chip" style="background:' + c[1] + ';box-shadow:0 0 0 3px #fff"></div></div>';
        }).join("");
        var cshots = document.querySelectorAll(".cshot");

        // ---- diyas ----
        var DIYA = '<svg viewBox="0 0 170 150" width="170" height="150"><ellipse cx="85" cy="70" rx="40" ry="60" fill="rgb(255 190 80 / 0.25)" class="glow"/><path class="flame" d="M85 18 C100 45 102 62 85 76 C68 62 70 45 85 18Z" fill="#ffc23a"/><path class="flame" d="M85 40 C92 54 92 64 85 72 C78 64 78 54 85 40Z" fill="#fff4c2"/><path d="M10 88 H160 C150 130 120 146 85 146 C50 146 20 130 10 88Z" fill="#b5501f"/><path d="M10 88 H160" stroke="#f5a300" stroke-width="8" stroke-linecap="round"/><path d="M40 112 H130" stroke="#f5a300" stroke-width="4" stroke-dasharray="6 10"/></svg>';
        document.getElementById("diyas").innerHTML = [180, 400, 680, 900].map(function (x) { return '<div class="diya" style="left:' + x + 'px">' + DIYA + "</div>"; }).join("");

        // ---- woven MM mark ----
        function markSVG(svgEl, id, inner, outer) {
          var a = 64, b = 112, s = 0.625, t2 = 24, B = 200, sw = 18, gap = 9;
          var v1 = a * s, v2 = t2 + b * s, yc = t2 + (b - a) * s;
          var P = function (pts) { return "M" + pts.map(function (q) { return q.join(","); }).join("L"); };
          var len = Math.hypot(1, s), ux = -1 / len, uy = s / len, r = function (k) { return +k.toFixed(2); };
          var seg = function (L) { return { left: "M" + -a + "," + r(yc - L) + "L" + -a + "," + r(yc + L), right: "M" + r(a - ux * L) + "," + r(yc - uy * L) + "L" + r(a + ux * L) + "," + r(yc + uy * L) }; };
          var cut = seg(sw * 2), redraw = seg(sw * 3.6), pad = sw;
          svgEl.setAttribute("viewBox", (-b - pad) + " " + (-pad * 2) + " " + (2 * (b + pad)) + " " + (B + pad * 3));
          var st = 'fill="none" stroke-width="' + sw + '" stroke-linejoin="miter" stroke-miterlimit="4"';
          svgEl.innerHTML = '<mask id="' + id + '" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800"><rect x="-400" y="-400" width="800" height="800" fill="#fff"/><path d="' + cut.left + cut.right + '" stroke="#000" stroke-width="' + (sw + 2 * gap) + '"/></mask>' +
            '<g class="mo"><path d="' + P([[a, B], [b, B], [b, t2], [0, v2], [-b, t2], [-b, B], [-a, B]]) + '" stroke="' + outer + '" mask="url(#' + id + ')" ' + st + '/><path d="' + redraw.right + '" stroke="' + outer + '" ' + st + "/></g>" +
            '<g class="mi"><path d="' + P([[-a, B], [-a, 0], [0, v1], [a, 0], [a, B]]) + '" stroke="' + inner + '" stroke-linecap="square" mask="url(#' + id + ')" ' + st + '/><path d="' + redraw.left + '" stroke="' + inner + '" ' + st + "/></g>";
        }
        document.querySelectorAll("svg.mm").forEach(function (el, i) { markSVG(el, "mmn" + i, el.dataset.inner, el.dataset.outer); });

        Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : 0; }))).then(function () {
          var tl = gsap.timeline({ paused: true });
          // beat grid: music starts on a downbeat, a beat every 0.5s

          // ===== 1 (0 to 2.5): toran drops, dandiya clack on the beats, the greeting slams on 1.0 =====
          tl.fromTo(".strand", { y: -420 }, { y: 0, duration: 0.55, ease: "bounce.out", stagger: 0.03 }, 0);
          [0.5, 1.0, 1.5].forEach(function (t, i) {
            tl.fromTo("#stickL", { rotation: -55, x: -150 }, { rotation: -14, x: -22, duration: 0.22, ease: "power3.in" }, t - 0.22);
            tl.fromTo("#stickR", { rotation: 55, x: 150 }, { rotation: 14, x: 22, duration: 0.22, ease: "power3.in" }, t - 0.22);
            tl.fromTo("#spark1 i", { scaleY: 0.2, opacity: 1, y: 0 }, { scaleY: 1, opacity: 0, y: -30, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
          });
          tl.to("#stickL", { rotation: -40, x: -120, duration: 0.3, ease: "power2.out" }, 1.55);
          tl.to("#stickR", { rotation: 40, x: 120, duration: 0.3, ease: "power2.out" }, 1.55);
          tl.fromTo("#s1-title", { scale: 1.6, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 1.0);
          tl.fromTo("#s1-sub", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.5);
          // ===== 2 (2.5 to 4.5): rangoli blooms =====
          document.querySelectorAll("#m2 .ring").forEach(function (rg, i) {
            tl.fromTo(rg, { scale: 0, rotation: -90, transformOrigin: "0 0" }, { scale: 1, rotation: 0, transformOrigin: "0 0", duration: 0.6, ease: "back.out(1.6)" }, 2.5 + (4 - i) * 0.08);
          });
          tl.fromTo("#m2 svg", { rotation: 0 }, { rotation: 40, duration: 2, ease: "none" }, 2.5);
          // ===== 3 (4.5 to 9): nine colours, one per beat (handled per frame) =====
          // ===== 4 (9 to 12.5): the mark blooms inside the rangoli, then the wish =====
          document.querySelectorAll("#m4 .ring").forEach(function (rg, i) {
            tl.fromTo(rg, { scale: 0, transformOrigin: "0 0" }, { scale: 1, transformOrigin: "0 0", duration: 0.55, ease: "back.out(1.6)" }, 9.0 + (4 - i) * 0.07);
          });
          tl.fromTo("#m4 svg", { rotation: 0 }, { rotation: -30, duration: 3.5, ease: "none" }, 9.0);
          tl.fromTo("#s4-mark .mi", { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 9.45);
          tl.fromTo("#s4-mark .mo", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 9.5);
          tl.fromTo("#s4-l1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 10.0);
          tl.fromTo("#s4-l2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 10.25);
          tl.fromTo("#s4-en", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.6);
          // ===== 5 (12.5 to 16.5): end card with diyas =====
          tl.fromTo("#s5-lock .mi", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 12.5);
          tl.fromTo("#s5-lock .mo", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 12.54);
          tl.fromTo("#s5-name", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 12.8);
          tl.fromTo("#s5-hi", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 13.0);
          tl.fromTo("#s5-url", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 13.5);
          tl.fromTo(".diya", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.7)", stagger: 0.1 }, 12.6);

          // per frame: colour shots on the beat, toran sway, diya flicker
          var strands = document.querySelectorAll(".strand"), flames = document.querySelectorAll(".flame"), glows = document.querySelectorAll(".glow"), last = -1;
          tl.eventCallback("onUpdate", function () {
            var t = tl.time();
            var k = t >= 4.5 && t < 9 ? Math.min(8, Math.floor((t - 4.5) / 0.5)) : -1;
            if (k !== last) { cshots.forEach(function (c, j) { c.style.display = j === k ? "block" : "none"; }); last = k; }
            if (k >= 0) { var p = (t - 4.5 - k * 0.5) / 0.5; cshots[k].querySelector(".photo").style.transform = "scale(" + (1.12 - 0.08 * p).toFixed(3) + ")"; }
            strands.forEach(function (st, i) { st.style.rotate = (Math.sin(t * 5 + i * 0.9) * 3.5).toFixed(2) + "deg"; });
            flames.forEach(function (f, i) { f.style.scale = (1 + Math.sin(t * 23 + i * 1.7) * 0.06 + Math.sin(t * 37 + i) * 0.04).toFixed(3); });
            glows.forEach(function (g, i) { g.style.opacity = (0.75 + Math.sin(t * 19 + i * 2.1) * 0.25).toFixed(3); });
          });

          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
