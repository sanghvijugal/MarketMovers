<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Diwali diyas</title>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/mm.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Plex Hindi"; src: url("assets/fonts/ibm-plex-sans-devanagari-devanagari-600-normal.woff2") format("woff2"); font-weight: 600; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #120618; }
      body { font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 55%, #3a1235 0%, #1d0a22 55%, #0c0410 100%); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      img { position: absolute; display: block; }
      svg text { font-family: "Geist", sans-serif; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <img id="toran" src="assets/img/st-toran.png" alt="" style="left:190px;top:-30px;width:700px" />
        <svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <div id="end"></div>
      </section>
      <!-- "Happy Diwali" (Home Delivery), 18.18 s to 33.18 s, a beat every 0.384 s: one diya lights every two beats -->
      <audio id="song" src="assets/audio/song.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        var B = 0.384, b = function (n) { return n * B; }, el = MM.el, sc = document.getElementById("sc");
        var defs = el("defs", {}, sc);
        var gl = el("filter", { id: "glow", x: "-80%", y: "-80%", width: "260%", height: "260%" }, defs);
        el("feGaussianBlur", { stdDeviation: 7, result: "b" }, gl);
        var mg = el("feMerge", {}, gl); el("feMergeNode", { in: "b" }, mg); el("feMergeNode", { in: "SourceGraphic" }, mg);
        var hg = el("radialGradient", { id: "halo" }, defs);
        [["0%", "rgb(255 190 70 / 0.6)"], ["100%", "rgb(255 190 70 / 0)"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, hg); });
        var NAMES = ["FINOLEX", "ASTRAL", "DUTRON", "SINTEX", "TEXMO", "VECTUS", "WATERFLO", "JOHNSON BATHROOMS", "KISAN", "PLASTO", "MBH", "REWA", "RECO"];
        var POS = [];
        [[120, 330, 540, 750, 960], [225, 435, 645, 855], [225, 435, 645, 855]].forEach(function (xs, r) { xs.forEach(function (x) { POS.push([x, 640 + r * 360]); }); });
        var D = NAMES.map(function (nm, i) {
          var g = el("g", {}, sc);
          var halo = el("circle", { cx: 0, cy: -40, r: 120, fill: "url(#halo)" }, g);
          el("path", { d: "M-70 0 Q0 62 70 0 Z", fill: "#b5501f", stroke: "#4a1f08", "stroke-width": 4 }, g);
          el("path", { d: "M-70 0 Q-40 -12 0 -10 Q40 -12 70 0", fill: "#7a3410", stroke: "#4a1f08", "stroke-width": 4 }, g);
          el("path", { d: "M-46 16 Q0 40 46 16", fill: "none", stroke: "#f5a300", "stroke-width": 5, "stroke-dasharray": "4 9", "stroke-linecap": "round" }, g);
          el("path", { d: "M58 -6 Q86 -18 82 -2", fill: "#b5501f", stroke: "#4a1f08", "stroke-width": 4 }, g);
          var flame = el("g", { filter: "url(#glow)" }, g);
          el("path", { d: "M0 -88 C22 -56 24 -34 0 -16 C-24 -34 -22 -56 0 -88 Z", fill: "#ffb02e" }, flame);
          el("path", { d: "M0 -62 C10 -46 11 -34 0 -24 C-11 -34 -10 -46 0 -62 Z", fill: "#fff4c2" }, flame);
          el("line", { x1: 0, y1: -18, x2: 0, y2: -8, stroke: "#2b1a10", "stroke-width": 3 }, g);
          var lines = nm.split(" "), fs = nm.length > 9 ? 26 : 32, txt = el("g", {}, g);
          lines.forEach(function (ln, k) { var t = el("text", { x: 0, y: 92 + k * (fs + 4), "text-anchor": "middle", "font-size": fs, "letter-spacing": "2" }, txt); t.textContent = ln; });
          return { g: g, halo: halo, flame: flame, txt: txt, p: POS[i], t: b(4 + 2 * i), i: i };
        });
        var endCard = MM.endCard(document.getElementById("end"), 430);
        var T_GATHER = b(30), T_END = b(32);

        function render(t) {
          D.forEach(function (d) {
            var i = d.i, kin = MM.out3(MM.seg(t, b(0) + i * 0.05, b(3) + i * 0.05));
            // gather: the lit diyas line up along the bottom under the wish
            var kg = MM.inOut(MM.seg(t, T_GATHER, T_END + 0.15));
            var fx = 540 + (i - 6) * 78, fy = 1530;
            var x = MM.lerp(d.p[0], fx, kg), y = MM.lerp(d.p[1] + 60 * (1 - kin), fy, kg), s = MM.lerp(1, 0.46, kg);
            d.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
            d.g.setAttribute("opacity", kin.toFixed(3));
            // ignition on its beat: flame pops, halo blooms, the brand name turns gold
            var lit = t >= d.t, kl = MM.back(MM.seg(t, d.t, d.t + 0.22), 2.2), flick = 1 + 0.06 * Math.sin(t * 19 + i * 2.1) + 0.04 * Math.sin(t * 31 + i);
            var flare = 1 + 0.35 * Math.max(0, 1 - Math.abs(t - T_GATHER) / 0.25);
            d.flame.setAttribute("opacity", lit ? 1 : 0);
            d.flame.setAttribute("transform", "translate(0 -16) scale(" + (lit ? kl * flick * flare : 0).toFixed(3) + ") translate(0 16)");
            d.halo.setAttribute("opacity", lit ? (MM.seg(t, d.t, d.t + 0.3) * (0.8 + 0.2 * Math.sin(t * 7 + i))).toFixed(3) : 0);
            var tc = lit ? "#f5c542" : "#a893ad";
            d.txt.setAttribute("fill", tc);
            d.txt.setAttribute("opacity", (1 - MM.seg(t, T_GATHER, T_GATHER + 0.25)).toFixed(3));
            d.txt.setAttribute("transform", "scale(" + (lit ? 1 + 0.12 * Math.max(0, 1 - (t - d.t) / 0.25) : 1).toFixed(3) + ")");
          });
          var kt = MM.out3(MM.seg(t, 0, 0.45)), up = MM.inOut(MM.seg(t, T_GATHER, T_END));
          document.getElementById("toran").style.transform = "translateY(" + (-500 * (1 - kt) - 560 * up).toFixed(1) + "px)";
          endCard(t, T_END);
          document.getElementById("stage").style.transform = "scale(" + (1 + 0.025 * MM.seg(t, T_END, 15)).toFixed(4) + ")";
        }
        Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : 0; }))).then(function () {
          var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
          tl.to(clock, { t: 15, duration: 15, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
