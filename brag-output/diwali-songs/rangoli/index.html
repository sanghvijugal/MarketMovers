<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Diwali rangoli</title>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/mm.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Plex Hindi"; src: url("assets/fonts/ibm-plex-sans-devanagari-devanagari-600-normal.woff2") format("woff2"); font-weight: 600; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #3a0610; }
      body { font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #7a1424 0%, #4a0a14 55%, #2a040b 100%); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      img { position: absolute; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <svg id="rg" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <img id="diyaL" src="assets/img/st-diya.png" alt="" style="left:60px;top:1330px;width:300px" />
        <img id="diyaR" src="assets/img/st-diya.png" alt="" style="left:720px;top:1330px;width:300px" />
        <div id="end"></div>
      </section>
      <!-- "Happy Diwali" (Home Delivery), 64.27 s to 79.27 s: the chorus, a beat every 0.384 s; every piece lands on a beat -->
      <audio id="song" src="assets/audio/song.wav" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        var B = 0.384, b = function (n) { return n * B; };
        var X = 540, Y = 960, el = MM.el, svg = document.getElementById("rg");
        var root = el("g", {}, svg);
        // ---- powder rings (behind the fittings) ----
        function petals(r0, r1, n, col, off) {
          var d = "";
          for (var k = 0; k < n; k++) {
            var a = (k / n) * Math.PI * 2 + (off || 0), w = Math.PI / n * 0.95;
            var p = function (ang, r) { return (Math.cos(ang) * r).toFixed(1) + " " + (Math.sin(ang) * r).toFixed(1); };
            d += "M" + p(a - w, r0) + " Q" + p(a - w * 0.9, (r0 + r1) / 2) + " " + p(a, r1) + " Q" + p(a + w * 0.9, (r0 + r1) / 2) + " " + p(a + w, r0) + " Z";
          }
          return el("path", { d: d, fill: col }, root);
        }
        var P0 = el("circle", { r: 150, fill: "#f26b1d" }, root);
        var P0b = el("circle", { r: 118, fill: "#f5c542" }, root);
        var P1 = petals(140, 270, 8, "#d6246e", Math.PI / 8);
        var P2 = el("circle", { r: 360, fill: "none", stroke: "#0b8a8f", "stroke-width": 70, "stroke-dasharray": "40 22" }, root);
        var P3 = petals(380, 520, 16, "#f5a300", 0);
        var P3b = petals(380, 470, 16, "#fbf3e2", Math.PI / 16);
        // ---- fittings, drawn as PVC parts ----
        function tube(d, parent) { el("path", { d: d, fill: "none", stroke: "#56606a", "stroke-width": 44, "stroke-linecap": "butt" }, parent); el("path", { d: d, fill: "none", stroke: "#eef2f4", "stroke-width": 34, "stroke-linecap": "butt" }, parent); el("path", { d: d, fill: "none", stroke: "#ffffff", "stroke-width": 8, transform: "translate(-6 -6)", opacity: 0.7 }, parent); }
        function collar(x, y, rot, parent) { el("rect", { x: -27, y: -10, width: 54, height: 20, rx: 5, fill: "#d9dfe3", stroke: "#56606a", "stroke-width": 5, transform: "translate(" + x + " " + y + ") rotate(" + rot + ")" }, parent); }
        function elbow(parent) { var g = el("g", {}, parent); tube("M-40 30 L-40 -10 Q-40 -40 -10 -40 L30 -40", g); collar(-40, 30, 0, g); collar(30, -40, 90, g); return g; }
        function tee(parent) { var g = el("g", {}, parent); tube("M-55 0 L55 0", g); tube("M0 0 L0 50", g); collar(-55, 0, 90, g); collar(55, 0, 90, g); collar(0, 50, 0, g); return g; }
        function ray(parent) { var g = el("g", {}, parent); tube("M0 -55 L0 55", g); collar(0, -55, 0, g); collar(0, 55, 0, g); return g; }
        function tap(parent) { var g = el("g", {}, parent); el("image", { href: "assets/img/st-tap.png", x: -62, y: -70, width: 124, height: 141 }, g); return g; }
        var items = [];
        function ring(n, r, off, make, start, step, rotAdd) {
          for (var k = 0; k < n; k++) {
            var a = (k / n) * 360 + off, g = make(root);
            items.push({ g: g, a: a, r: r, t: b(start + k * step), rot: a + 90 + (rotAdd || 0) });
          }
        }
        ring(8, 200, 0, elbow, 4, 1, 45);
        ring(8, 315, 22.5, tee, 12, 1, 180);
        ring(8, 330, 0, ray, 20, 0.25, 0);
        ring(8, 445, 0, tap, 22, 1, 0);
        var diya = el("image", { href: "assets/img/st-diya.png", x: -95, y: -99, width: 190, height: 198 }, root);
        var endCard = MM.endCard(document.getElementById("end"), 430);
        var T_FOLD = b(30), T_END = b(32);

        function render(t) {
          // the whole rangoli: built at the centre, then spins half a turn and folds into a halo behind the logo
          var f = MM.inOut(MM.seg(t, T_FOLD, T_END + 0.1)), sc = MM.lerp(1, 0.34, f), cy = MM.lerp(Y, 430, f);
          root.setAttribute("transform", "translate(" + X + " " + cy.toFixed(1) + ") rotate(" + (180 * f).toFixed(2) + ") scale(" + sc.toFixed(4) + ")");
          var pop = function (node, t0, d) { var k = MM.back(MM.seg(t, t0, t0 + (d || 0.3)), 1.4); node.setAttribute("transform", "scale(" + k.toFixed(3) + ")"); node.setAttribute("opacity", t < t0 ? 0 : 1); };
          pop(P0, b(0), 0.6); pop(P0b, b(1), 0.5); pop(P1, b(12), 0.35); pop(P2, b(20), 0.35); pop(P3, b(30) - 0.2, 0.3); pop(P3b, b(30) - 0.1, 0.3);
          // diya: lights on the first beat and stays in the centre
          var kd = MM.back(MM.seg(t, 0, 0.35), 2);
          diya.setAttribute("transform", "scale(" + (kd * (1 + 0.03 * Math.sin(t * 11))).toFixed(3) + ")");
          // each fitting flies in from outside and lands exactly on its beat
          items.forEach(function (it, i) {
            var t0 = it.t - 0.22, k = MM.out3(MM.seg(t, t0, it.t)), land = MM.seg(t, it.t, it.t + 0.12);
            if (t < t0) { it.g.setAttribute("display", "none"); return; }
            it.g.setAttribute("display", "inline");
            var r = MM.lerp(it.r + 700, it.r, k), a = it.a * Math.PI / 180, s = 1 + 0.18 * (1 - land) * (land > 0 ? 1 : 0);
            it.g.setAttribute("transform", "translate(" + (Math.cos(a) * r).toFixed(1) + " " + (Math.sin(a) * r).toFixed(1) + ") rotate(" + (it.rot + 90 * (1 - k)).toFixed(1) + ") scale(" + s.toFixed(3) + ")");
          });
          // diyas at the bottom join on the end card
          ["diyaL", "diyaR"].forEach(function (id, i) {
            var k = MM.back(MM.seg(t, T_END + 0.2 + i * 0.1, T_END + 0.5 + i * 0.1), 1.8);
            var d = document.getElementById(id); d.style.transform = "translateY(" + (700 * (1 - k)).toFixed(1) + "px)"; d.style.opacity = t < T_END + 0.2 + i * 0.1 ? 0 : 1;
          });
          endCard(t, T_END);
          document.getElementById("stage").style.transform = "scale(" + (1 + 0.025 * MM.seg(t, T_END, 15)).toFixed(4) + ")";
        }
        Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : 0; }))).then(function () {
          var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
          tl.to(clock, { t: 15, duration: 15, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
