<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Market Movers Dhanteras</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url("assets/fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Plex Hindi"; src: url("assets/fonts/ibm-plex-sans-devanagari-devanagari-600-normal.woff2") format("woff2"); font-weight: 600; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #4a0a14; }
      body { font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 55%, #7a1424 0%, #4a0a14 60%, #2e050c 100%); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      img { position: absolute; display: block; }
      svg { position: absolute; overflow: visible; }
      .bc text { font-family: "Geist", sans-serif; font-weight: 800; }
      #end p { position: absolute; left: 0; right: 0; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <section id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="glow" style="position:absolute;left:540px;top:1380px;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(closest-side, rgb(255 190 60 / 0.55), rgb(255 190 60 / 0) 100%);opacity:0"></div>
        <svg id="feet" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <img id="tap" src="assets/img/st-tap.png" alt="" style="left:470px;top:470px;width:420px;transform-origin:50% 0" />
        <svg id="bowlback" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <svg id="coins" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <svg id="bowlfront" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <img id="diyaL" src="assets/img/st-diya.png" alt="" style="left:20px;top:1300px;width:230px" />
        <img id="diyaR" src="assets/img/st-diya.png" alt="" style="left:830px;top:1300px;width:230px" />
        <svg id="brands" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
        <div id="end">
          <div id="badge" style="position:absolute;left:540px;top:665px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:#fbf3e2;box-shadow:0 0 0 12px #f5c542, 0 0 0 20px #2b1a10;display:flex;align-items:center;justify-content:center">
            <svg class="mm" data-inner="#1b1b1b" data-outer="#0b5d63" style="position:relative;width:176px;height:auto"></svg>
          </div>
          <p id="e1" style="top:845px;font-size:138px;line-height:0.95;font-weight:900;color:#f5c542;-webkit-text-stroke:6px #2b1a10;paint-order:stroke fill;text-shadow:0 10px 0 #1c0307">Shubh<br>Dhanteras</p>
          <p id="e2" style="top:1112px;font-family:'Plex Hindi',sans-serif;font-size:58px;font-weight:600;color:#fbf3e2">शुभ धनतेरस</p>
        </div>
        <img id="toran" src="assets/img/st-toran.png" alt="" style="left:170px;top:16px;width:740px" />
        <p id="name" style="position:absolute;left:0;right:0;top:1200px;text-align:center;font-size:30px;font-weight:700;letter-spacing:0.16em;color:#f5c542">MARKET MOVERS · MARHATAL, JABALPUR</p>
      </section>
      <!-- shehnai, temple bells and coin jingles, generated by make_audio.py from the same timing list -->
      <audio id="music" src="assets/audio/dhanteras.wav" data-start="0" data-duration="12" data-track-index="10" data-volume="1"></audio>
    </div>

    <!-- one timing list drives both the picture and the soundtrack (make_audio.py reads it from this file) -->
    <script type="application/json" id="events">/*EVENTS*/</script>

    <script>
      (function () {
        var EV = JSON.parse(document.getElementById("events").textContent);
        var NS = "http://www.w3.org/2000/svg";
        function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
        function clamp(x) { return Math.max(0, Math.min(1, x)); }
        var G = EV.gravity, SP = EV.spout, BOWL = EV.bowl;

        // ---- gradients ----
        var defs = el("defs", {}, document.getElementById("coins"));
        var gg = el("radialGradient", { id: "gold", cx: "40%", cy: "35%", r: "70%" }, defs);
        [["0%", "#fff1a8"], ["45%", "#f5c542"], ["100%", "#a8740f"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, gg); });
        var bg = el("linearGradient", { id: "brass", x1: "0", y1: "0", x2: "0", y2: "1" }, defs);
        [["0%", "#f7d36b"], ["55%", "#c98f1c"], ["100%", "#7a4f08"]].forEach(function (s) { el("stop", { offset: s[0], "stop-color": s[1] }, bg); });

        // ---- urli (brass bowl): back rim, then the coin pile, then the front ----
        var cx = BOWL.x, ry = BOWL.rimY, rw = BOWL.w / 2;
        el("ellipse", { cx: cx, cy: ry, rx: rw, ry: 46, fill: "#a8740f" }, document.getElementById("bowlback"));
        var front = document.getElementById("bowlfront");
        el("path", { d: "M" + (cx - rw) + " " + ry + " C " + (cx - rw + 30) + " " + (ry + 210) + ", " + (cx + rw - 30) + " " + (ry + 210) + ", " + (cx + rw) + " " + ry + " A " + rw + " 46 0 0 1 " + (cx - rw) + " " + ry + " Z", fill: "url(#brass)", stroke: "#3b2203", "stroke-width": 6 }, front);
        el("path", { d: "M" + (cx - rw) + " " + ry + " A " + rw + " 46 0 0 0 " + (cx + rw) + " " + ry, fill: "none", stroke: "#ffe7a0", "stroke-width": 12, "stroke-linecap": "round" }, front);
        for (var i = 0; i < 7; i++) { var px = cx - 210 + i * 70; el("circle", { cx: px, cy: ry + 95 + Math.sin(i / 6 * Math.PI) * 18, r: 9, fill: "#8a1a10", opacity: 0.8 }, front); }

        // ---- coins: each falls from the spout and lands on the pile at its scheduled time ----
        var coinG = document.getElementById("coins");
        function coin(r, parent) {
          var g = el("g", {}, parent);
          el("circle", { r: r, fill: "url(#gold)", stroke: "#7a4f08", "stroke-width": Math.max(2, r * 0.08) }, g);
          el("circle", { r: r * 0.68, fill: "none", stroke: "#a8740f", "stroke-width": Math.max(1.5, r * 0.06), opacity: 0.8 }, g);
          return g;
        }
        var COINS = EV.coins.map(function (c) { return { c: c, g: coin(c.r, coinG) }; });
        function fallTime(c) { return Math.sqrt(2 * (c.y - SP.y) / G); }
        function placeCoin(o, t) {
          var c = o.c, ft = fallTime(c), t0 = c.t - ft;
          if (t < t0) { o.g.setAttribute("display", "none"); return; }
          o.g.setAttribute("display", "inline");
          if (t >= c.t) { o.g.setAttribute("transform", "translate(" + c.x + " " + c.y + ") rotate(" + c.rot + ") scale(1 0.42)"); return; }
          var u = (t - t0) / ft, x = SP.x + (c.x - SP.x) * u, y = SP.y + 0.5 * G * (t - t0) * (t - t0);
          var flip = Math.cos((t - t0) * c.spin);
          o.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + c.rot + ") scale(" + flip.toFixed(3) + " 1)");
        }

        // ---- Lakshmi footprints in kumkum ----
        var feetG = document.getElementById("feet");
        var FEET = EV.steps.map(function (s) {
          var g = el("g", { transform: "translate(" + s.x + " " + s.y + ") scale(" + (s.side === "L" ? -0.78 : 0.78) + " 0.78)" }, feetG);
          el("path", { d: "M0 -40 C 34 -40 40 0 30 40 C 22 70 -18 72 -24 40 C -32 6 -30 -40 0 -40 Z", fill: "#c8102e" }, g);
          [[-20, -62, 10], [-4, -70, 9], [10, -68, 8], [22, -60, 7], [30, -48, 6]].forEach(function (t) { el("circle", { cx: t[0], cy: t[1], r: t[2], fill: "#c8102e" }, g); });
          el("circle", { cx: 0, cy: 0, r: 7, fill: "#f5c542" }, g);
          return { g: g, t: s.t };
        });

        // ---- brand coins: pop out of the bowl and flip to show each brand ----
        var bG = document.getElementById("brands");
        var BR = EV.brands.map(function (b) {
          var g = el("g", { class: "bc" }, bG);
          var back = coin(98, g);
          var face = el("g", {}, g);
          el("circle", { r: 98, fill: "url(#gold)", stroke: "#7a4f08", "stroke-width": 7 }, face);
          el("circle", { r: 84, fill: "#fbf3e2", stroke: "#a8740f", "stroke-width": 4 }, face);
          var lines = b.name.split(" "), fs = b.name.length > 9 ? 25 : 30;
          lines.forEach(function (ln, k) {
            var tx = el("text", { x: 0, y: (k - (lines.length - 1) / 2) * (fs + 4) + fs * 0.36, "text-anchor": "middle", "font-size": fs, fill: "#2b1a10" }, face);
            tx.textContent = ln;
          });
          return { g: g, back: back, face: face, b: b };
        });

        // ---- woven MM mark (LogoMark.astro geometry, unchanged) ----
        function markSVG(svgEl, id, inner, outer) {
          var a = 64, b = 112, s = 0.625, t2 = 24, B = 200, sw = 18, gap = 9;
          var v1 = a * s, v2 = t2 + b * s, yc = t2 + (b - a) * s;
          var Pp = function (pts) { return "M" + pts.map(function (q) { return q.join(","); }).join("L"); };
          var len = Math.hypot(1, s), ux = -1 / len, uy = s / len, r = function (k) { return +k.toFixed(2); };
          var sg = function (L) { return { left: "M" + -a + "," + r(yc - L) + "L" + -a + "," + r(yc + L), right: "M" + r(a - ux * L) + "," + r(yc - uy * L) + "L" + r(a + ux * L) + "," + r(yc + uy * L) }; };
          var cut = sg(sw * 2), redraw = sg(sw * 3.6), pad = sw;
          svgEl.setAttribute("viewBox", (-b - pad) + " " + (-pad * 2) + " " + (2 * (b + pad)) + " " + (B + pad * 3));
          var st = 'fill="none" stroke-width="' + sw + '" stroke-linejoin="miter" stroke-miterlimit="4"';
          svgEl.innerHTML = '<mask id="' + id + '" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800"><rect x="-400" y="-400" width="800" height="800" fill="#fff"/><path d="' + cut.left + cut.right + '" stroke="#000" stroke-width="' + (sw + 2 * gap) + '"/></mask>' +
            '<g><path d="' + Pp([[a, B], [b, B], [b, t2], [0, v2], [-b, t2], [-b, B], [-a, B]]) + '" stroke="' + outer + '" mask="url(#' + id + ')" ' + st + '/><path d="' + redraw.right + '" stroke="' + outer + '" ' + st + "/></g>" +
            '<g><path d="' + Pp([[-a, B], [-a, 0], [0, v1], [a, 0], [a, B]]) + '" stroke="' + inner + '" stroke-linecap="square" mask="url(#' + id + ')" ' + st + '/><path d="' + redraw.left + '" stroke="' + inner + '" ' + st + "/></g>";
        }
        document.querySelectorAll("svg.mm").forEach(function (e, i) { markSVG(e, "mmd" + i, e.dataset.inner, e.dataset.outer); });

        var T = EV.t;
        function render(t) {
          COINS.forEach(function (o) { placeCoin(o, t); });
          // pile and bowl leave together with everything else on the end card? no: they stay as the base of the end card
          FEET.forEach(function (f) {
            var k = clamp((t - f.t) / 0.12), fade = 1 - clamp((t - T.end) / 0.2);
            f.g.style.opacity = (k * fade).toFixed(3);
          });
          var gk = clamp((t - T.diya) / 0.3) * (1 + 0.08 * Math.sin(t * 9));
          document.getElementById("glow").style.opacity = gk.toFixed(3);
          BR.forEach(function (o, i) {
            var b = o.b, k = clamp((t - b.t) / 0.32), gone = clamp((t - T.end) / 0.2);
            if (t < b.t || gone >= 1) { o.g.setAttribute("display", "none"); return; }
            o.g.setAttribute("display", "inline");
            var e = 1 - Math.pow(1 - k, 3), x = BOWL.x + (b.x - BOWL.x) * e, y = BOWL.rimY + (b.y - BOWL.rimY) * e - Math.sin(e * Math.PI) * 120;
            var ang = e * Math.PI, sx = Math.cos(ang);
            o.back.setAttribute("display", sx > 0 ? "inline" : "none"); o.face.setAttribute("display", sx > 0 ? "none" : "inline");
            var s = (0.4 + 0.6 * e) * (1 - gone);
            o.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") scale(" + (Math.abs(sx) * s).toFixed(3) + " " + s.toFixed(3) + ")");
          });
        }

        Promise.all([document.fonts.ready].concat([].map.call(document.images, function (im) { return im.decode ? im.decode().catch(function () {}) : 0; }))).then(function () {
          var tl = gsap.timeline({ paused: true }), clock = { t: 0 };
          tl.to(clock, { t: 12, duration: 12, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
          // toran drops with the first bell; tap swings in; handle turn on the click
          tl.fromTo("#toran", { y: -520 }, { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 0);
          tl.fromTo("#tap", { x: 900, rotation: 25 }, { x: 0, rotation: 0, duration: 0.55, ease: "back.out(1.4)" }, T.tap);
          tl.to("#tap", { rotation: -4, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, T.click);
          tl.to("#tap", { y: -700, opacity: 0, duration: 0.35, ease: "power2.in" }, T.flip0 - 0.1);
          tl.fromTo(["#bowlback", "#bowlfront"], { y: 700 }, { y: 0, duration: 0.5, ease: "back.out(1.3)", immediateRender: true }, T.tap + 0.2);
          tl.fromTo("#diyaL", { x: -400, scale: 0.6 }, { x: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T.diya);
          tl.fromTo("#diyaR", { x: 400, scale: 0.6 }, { x: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, T.diya);
          // end card on the closing bell
          tl.set("#end", { opacity: 0 }, 0); tl.set("#end", { opacity: 1 }, T.end);
          tl.fromTo("#badge", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.7)" }, T.end);
          tl.fromTo("#e1", { scale: 1.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, T.end + 0.15);
          tl.fromTo("#e2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, T.end + 0.45);
          tl.fromTo("#name", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.end + 0.6);
          tl.fromTo("#stage", { scale: 1 }, { scale: 1.03, duration: 12 - T.end, ease: "none" }, T.end);
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
