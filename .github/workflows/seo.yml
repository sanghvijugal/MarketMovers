name: SEO

# Keeps the SEO basics correct as the site changes:
#  - on every push / PR: rebuild sitemap.xml and fail if any page breaks the rules
#  - on pushes to main: commit the refreshed sitemap.xml (new pages, lastmod dates)
#  - weekly: check that links to manufacturer sites / PDFs still work
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for accurate <lastmod> dates

      - name: Rebuild sitemap.xml
        run: python3 tools/seo.py sitemap

      - name: Check pages
        run: python3 tools/seo.py check

      - name: Commit updated sitemap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap.xml"
          git push

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        run: python3 tools/seo.py links
